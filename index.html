<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHP Healthcare Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0C2340; --navy-border: rgba(255,255,255,0.1);
    --blue-accent: #4A9FE0; --blue-light: #E6F1FB; --blue-mid: #185FA5;
    --bg: #F2F4F7; --surface: #ffffff; --border: #E2E6EC;
    --text-primary: #0C2340; --text-secondary: #6B7A90; --text-muted: #A0AABB;
    --tag-deal-bg: #E6F1FB; --tag-deal-text: #185FA5;
    --tag-reg-bg: #FAEEDA; --tag-reg-text: #854F0B;
    --tag-fund-bg: #EEEDFE; --tag-fund-text: #534AB7;
    --tag-news-bg: #EAF3DE; --tag-news-text: #3B6D11;
    --pewhat-bg: #E6F1FB; --pewhat-border: #B5D4F4; --pewhat-text: #0C447C; --pewhat-label: #185FA5;
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text-primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { background: var(--navy); padding: 0 24px; height: 54px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; border-bottom: 0.5px solid var(--navy-border); }
  .logo { display: flex; align-items: center; gap: 10px; color: #fff; font-size: 14px; font-weight: 500; }
  .logo-mark { width: 28px; height: 28px; background: var(--blue-accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 11px; color: #fff; }
  .search-bar { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.07); border: 0.5px solid rgba(255,255,255,0.15); border-radius: var(--radius-md); padding: 7px 14px; width: 300px; transition: all 0.15s; }
  .search-bar:focus-within { background: rgba(255,255,255,0.11); border-color: var(--blue-accent); }
  .search-bar svg { color: rgba(255,255,255,0.35); flex-shrink: 0; }
  .search-bar input { background: none; border: none; outline: none; color: #fff; font-family: 'DM Sans', sans-serif; font-size: 13px; width: 100%; }
  .search-bar input::placeholder { color: rgba(255,255,255,0.35); }
  .search-type { display: flex; gap: 4px; }
  .search-type button { background: none; border: 0.5px solid rgba(255,255,255,0.15); border-radius: 20px; color: rgba(255,255,255,0.45); font-family: 'DM Sans', sans-serif; font-size: 11px; padding: 4px 10px; cursor: pointer; transition: all 0.15s; }
  .search-type button.active, .search-type button:hover { background: var(--blue-accent); border-color: var(--blue-accent); color: #fff; }
  .tabs { background: var(--navy); padding: 0 24px; display: flex; flex-shrink: 0; }
  .tab { padding: 10px 18px; font-size: 12.5px; color: rgba(255,255,255,0.45); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; user-select: none; }
  .tab:hover { color: rgba(255,255,255,0.75); }
  .tab.active { color: #fff; border-bottom-color: var(--blue-accent); }
  .app-body { display: flex; flex: 1; overflow: hidden; }
  .main { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .main::-webkit-scrollbar { width: 4px; }
  .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .section-label { font-size: 10.5px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; }
  .filter-pills { display: flex; gap: 6px; }
  .pill { font-size: 11px; padding: 3px 10px; border-radius: 20px; border: 0.5px solid var(--border); background: var(--surface); color: var(--text-secondary); cursor: pointer; transition: all 0.15s; }
  .pill:hover, .pill.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .feed-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: all 0.15s; display: flex; align-items: flex-start; gap: 12px; }
  .feed-card:hover { border-color: var(--blue-accent); box-shadow: 0 2px 12px rgba(74,159,224,0.08); }
  .feed-tag { font-size: 10px; font-weight: 500; padding: 3px 9px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; margin-top: 1px; }
  .tag-deal { background: var(--tag-deal-bg); color: var(--tag-deal-text); }
  .tag-reg { background: var(--tag-reg-bg); color: var(--tag-reg-text); }
  .tag-fund { background: var(--tag-fund-bg); color: var(--tag-fund-text); }
  .tag-news { background: var(--tag-news-bg); color: var(--tag-news-text); }
  .feed-content { flex: 1; min-width: 0; }
  .feed-title { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; line-height: 1.45; }
  .feed-sub { font-size: 12px; color: var(--text-secondary); line-height: 1.55; }
  .feed-meta { font-size: 11px; color: var(--text-muted); margin-top: 7px; }
  .chevron-icon { color: var(--border); flex-shrink: 0; margin-top: 2px; }
  .panel { width: 380px; background: var(--surface); border-left: 0.5px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
  .panel-inner { overflow-y: auto; padding: 20px; flex: 1; }
  .panel-inner::-webkit-scrollbar { width: 4px; }
  .panel-inner::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .panel-company { font-size: 17px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; }
  .panel-sub { font-size: 12px; color: var(--text-secondary); margin-bottom: 14px; }
  .private-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: var(--tag-reg-text); background: var(--tag-reg-bg); padding: 3px 8px; border-radius: 20px; margin-left: 8px; }
  .public-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: var(--tag-news-text); background: var(--tag-news-bg); padding: 3px 8px; border-radius: 20px; margin-left: 8px; }
  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .metric { background: var(--bg); border-radius: var(--radius-sm); padding: 10px 12px; }
  .metric-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .metric-val { font-size: 15px; font-weight: 500; color: var(--text-primary); font-family: 'DM Mono', monospace; }
  .divider { height: 0.5px; background: var(--border); margin: 14px 0; }
  .section-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s; }
  .section-card:hover { border-color: var(--blue-accent); }
  .section-card-header { display: flex; align-items: center; justify-content: space-between; }
  .section-card-title { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: var(--text-primary); }
  .section-icon { width: 22px; height: 22px; background: var(--blue-light); border-radius: 5px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .section-preview { font-size: 12px; color: var(--text-secondary); margin-top: 7px; line-height: 1.55; }
  .expand-icon { color: var(--text-muted); transition: transform 0.2s; }
  .section-card.open .expand-icon { transform: rotate(180deg); }
  .section-body { display: none; margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--border); font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; }
  .section-card.open .section-body { display: block; }
  .pewhat { background: var(--pewhat-bg); border: 0.5px solid var(--pewhat-border); border-radius: var(--radius-md); padding: 14px; margin-top: 4px; }
  .pewhat-label { font-size: 10px; font-weight: 500; color: var(--pewhat-label); text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 6px; }
  .pewhat-text { font-size: 12.5px; color: var(--pewhat-text); line-height: 1.6; }
  .empty-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 40px; text-align: center; }
  .empty-icon { width: 48px; height: 48px; background: var(--bg); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  .empty-title { font-size: 14px; font-weight: 500; color: var(--text-primary); margin-bottom: 6px; }
  .empty-sub { font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; }
  .loading-wrap { padding: 20px; }
  .loading-bar { height: 11px; background: var(--border); border-radius: 4px; margin-bottom: 10px; animation: pulse 1.5s ease infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .error-card { background: #FCEBEB; border: 0.5px solid #F7C1C1; border-radius: var(--radius-md); padding: 14px; font-size: 12.5px; color: #A32D2D; line-height: 1.6; margin-bottom: 10px; }
  .debug-card { background: #F8F9FB; border: 0.5px solid var(--border); border-radius: var(--radius-md); padding: 14px; font-size: 11px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 10px; font-family: 'DM Mono', monospace; word-break: break-all; max-height: 200px; overflow-y: auto; }
  .feed-view.hidden { display: none; }
  .search-view { display: none; }
  .search-view.active { display: block; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-mark">GHP</div>
    Healthcare Intelligence
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="search-bar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Search company or subsector..." />
    </div>
    <div class="search-type">
      <button class="active" id="btnCompany" onclick="setSearchType('company')">Company</button>
      <button id="btnSector" onclick="setSearchType('sector')">Subsector</button>
    </div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('feed',this)">Deal feed</div>
  <div class="tab" onclick="switchTab('search',this)">Company search</div>
  <div class="tab" onclick="switchTab('subsector',this)">Subsector search</div>
</div>

<div class="app-body">
  <div class="main">
    <div id="feedView">
      <div class="section-header">
        <span class="section-label" id="feedLabel">Loading deal feed...</span>
        <div class="filter-pills">
          <span class="pill active" onclick="filterFeed('all',this)">All</span>
          <span class="pill" onclick="filterFeed('deal',this)">Deals</span>
          <span class="pill" onclick="filterFeed('reg',this)">Regulatory</span>
          <span class="pill" onclick="filterFeed('fund',this)">Funds</span>
        </div>
      </div>
      <div id="feedContent">
        <div class="loading-wrap">
          <div class="loading-bar" style="width:70%"></div>
          <div class="loading-bar" style="width:90%"></div>
          <div class="loading-bar" style="width:55%"></div>
          <div class="loading-bar" style="width:80%"></div>
          <div class="loading-bar" style="width:65%"></div>
        </div>
      </div>
    </div>
    <div class="search-view" id="searchView">
      <div class="section-header">
        <span class="section-label" id="searchLabel">Search results</span>
      </div>
      <div id="searchContent">
        <div class="empty-panel" style="padding:60px 20px;">
          <div class="empty-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A9FE0" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div>
          <div class="empty-title">Search a company or subsector</div>
          <div class="empty-sub">Type in the search bar above and press Enter.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-inner" id="panelInner">
      <div class="empty-panel">
        <div class="empty-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A9FE0" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
        <div class="empty-title">Select a story</div>
        <div class="empty-sub">Click any item in the feed to see the full PE-angle analysis.</div>
      </div>
    </div>
  </div>
</div>

<script>
  const WORKER_URL = 'https://ghp-healthcare-api.jhads21.workers.dev';
  let searchType = 'company';
  let feedItems = [];

  function extractJSON(text, isArray) {
    if (!text) return null;
    let cleaned = text.trim();
    // Strip markdown code fences
    cleaned = cleaned.replace(/```json\s*/gi, '').replace(/```\s*/g, '').trim();
    // Find the outermost bracket
    const openChar = isArray ? '[' : '{';
    const closeChar = isArray ? ']' : '}';
    const start = cleaned.indexOf(openChar);
    const end = cleaned.lastIndexOf(closeChar);
    if (start === -1 || end === -1) return null;
    return cleaned.slice(start, end + 1);
  }

  async function callClaude(prompt) {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 3000,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`Worker error ${response.status}: ${errText}`);
    }

    const data = await response.json();

    if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));

    // Find the last text block — Claude puts final answer last
    const textBlocks = (data.content || []).filter(b => b.type === 'text');
    if (textBlocks.length === 0) throw new Error('No text response from Claude. Content: ' + JSON.stringify(data.content));
    return textBlocks[textBlocks.length - 1].text;
  }

  async function loadFeed() {
    try {
      const prompt = `You are a healthcare PE analyst for Great Hill Partners.

Search the web for recent healthcare private equity news from the last 7 days. Find 8 significant stories across: PE deals/acquisitions, regulatory changes, fund activity, and market developments.

You MUST respond with ONLY a valid JSON array. No introduction, no explanation, no markdown, no code fences. Start your response with [ and end with ].

Each object in the array must have exactly these fields:
{
  "tag": "deal" or "reg" or "fund" or "news",
  "title": "headline under 12 words",
  "summary": "2 sentence plain english summary",
  "meta": "X days ago · Source",
  "detail": "3-4 sentence expanded analysis of what happened",
  "pewhat": "2-3 sentences direct opinionated view on why this matters or does not matter for a growth PE healthcare investor"
}

Remember: respond with ONLY the JSON array, nothing else.`;

      const raw = await callClaude(prompt);
      const jsonStr = extractJSON(raw, true);
      if (!jsonStr) throw new Error('Could not find JSON array in response. Raw: ' + raw.substring(0, 200));
      feedItems = JSON.parse(jsonStr);
      renderFeed(feedItems);
      document.getElementById('feedLabel').textContent = 'Last 7 days — healthcare PE';
    } catch (err) {
      document.getElementById('feedContent').innerHTML = `
        <div class="error-card">Failed to load feed. Error: ${err.message}</div>`;
      document.getElementById('feedLabel').textContent = 'Feed unavailable';
    }
  }

  function renderFeed(items) {
    document.getElementById('feedContent').innerHTML = items.map((item, i) => `
      <div class="feed-card" onclick="showFeedDetail(${i})" data-tag="${item.tag}">
        <span class="feed-tag tag-${item.tag}">${tagLabel(item.tag)}</span>
        <div class="feed-content">
          <div class="feed-title">${item.title}</div>
          <div class="feed-sub">${item.summary}</div>
          <div class="feed-meta">${item.meta}</div>
        </div>
        <svg class="chevron-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </div>`).join('');
  }

  function tagLabel(tag) {
    return { deal: 'Deal', reg: 'Regulatory', fund: 'Fund activity', news: 'News' }[tag] || 'News';
  }

  function showFeedDetail(i) {
    const item = feedItems[i];
    if (!item) return;
    document.getElementById('panelInner').innerHTML = `
      <div style="margin-bottom:16px;">
        <span class="feed-tag tag-${item.tag}" style="margin-bottom:10px;display:inline-block;">${tagLabel(item.tag)}</span>
        <div class="panel-company" style="font-size:15px;line-height:1.4;">${item.title}</div>
        <div class="panel-sub" style="margin-top:6px;">${item.meta}</div>
      </div>
      ${sectionCard('What happened', item.detail, true)}
      <div class="divider"></div>
      <div class="pewhat"><div class="pewhat-label">PE so-what</div><div class="pewhat-text">${item.pewhat}</div></div>`;
  }

  async function runSearch(query) {
    document.getElementById('feedView').classList.add('hidden');
    document.getElementById('searchView').classList.add('active');
    document.getElementById('searchLabel').textContent = `Results for "${query}"`;
    document.getElementById('searchContent').innerHTML = `<div class="loading-wrap"><div class="loading-bar" style="width:70%"></div><div class="loading-bar" style="width:85%"></div><div class="loading-bar" style="width:55%"></div></div>`;
    document.getElementById('panelInner').innerHTML = `<div class="empty-panel"><div class="empty-title" style="color:var(--text-secondary)">Researching "${query}"...</div><div class="empty-sub">Pulling live data — takes about 15 seconds.</div></div>`;

    try {
      let prompt;
      if (searchType === 'company') {
        prompt = `You are a healthcare PE analyst for Great Hill Partners.

Research the company "${query}" using web search. Find recent earnings, news, and business information.

You MUST respond with ONLY a valid JSON object. No introduction, no explanation, no markdown, no code fences. Start with { and end with }.

{
  "name": "company name",
  "type": "public or private",
  "sub": "one line: sector · location",
  "what_they_do": "1-2 sentences plain english, no jargon. Example: They make small coils inserted into brain blood vessels to stop bleeding.",
  "how_they_make_money": "1-2 sentences plain english on the revenue model.",
  "metrics": [
    {"label": "Revenue", "val": "value or N/A"},
    {"label": "EBITDA", "val": "value or N/A"},
    {"label": "Growth", "val": "value or N/A"},
    {"label": "Ownership", "val": "public/private/PE-backed"}
  ],
  "earnings": "2-3 sentences on recent financials and key metrics with actual numbers where available.",
  "management": "2-3 sentences on what management is focused on and key themes.",
  "news": "2-3 sentences on the most recent significant news.",
  "pewhat": "2-3 sentences direct opinionated view: interesting or not for a growth PE healthcare investor and why. Be specific."
}`;
      } else {
        prompt = `You are a healthcare PE analyst for Great Hill Partners.

Research the healthcare subsector "${query}" using web search.

You MUST respond with ONLY a valid JSON object. No introduction, no explanation, no markdown, no code fences. Start with { and end with }.

{
  "name": "subsector name",
  "sub": "brief descriptor",
  "whats_happening": "2-3 sentences on the current state right now.",
  "transactions": "2-3 sentences on notable recent M&A or PE deals.",
  "tailwinds": "2-3 sentences on key growth drivers.",
  "headwinds": "2-3 sentences on key risks and challenges.",
  "regulatory": "2-3 sentences on the regulatory landscape and what is changing.",
  "pewhat": "2-3 sentences direct opinionated view: lean in or avoid for GHP right now and why."
}`;
      }

      const raw = await callClaude(prompt);
      const isArray = false;
      const jsonStr = extractJSON(raw, isArray);
      if (!jsonStr) throw new Error('Could not parse response. Raw: ' + raw.substring(0, 300));
      const data = JSON.parse(jsonStr);

      if (searchType === 'company') renderCompanyResult(data);
      else renderSectorResult(data);

    } catch (err) {
      document.getElementById('searchContent').innerHTML = `<div class="error-card">Search failed: ${err.message}</div>`;
      document.getElementById('panelInner').innerHTML = `<div class="empty-panel"><div class="empty-title" style="color:var(--text-secondary)">Search failed</div><div class="empty-sub">Try again or check your connection.</div></div>`;
    }
  }

  function renderCompanyResult(d) {
    const typeClass = d.type === 'private' ? 'private-badge' : 'public-badge';
    const typeLabel = d.type === 'private' ? '🔒 Private' : '📈 Public';
    const metricsHtml = (d.metrics || []).map(m => `<div class="metric"><div class="metric-label">${m.label}</div><div class="metric-val">${m.val}</div></div>`).join('');
    document.getElementById('searchContent').innerHTML = `
      <div class="feed-card" style="cursor:default;">
        <div class="feed-content">
          <div class="feed-title" style="font-size:15px;">${d.name} <span class="${typeClass}">${typeLabel}</span></div>
          <div class="feed-sub" style="margin-top:4px;">${d.sub}</div>
        </div>
      </div>`;
    document.getElementById('panelInner').innerHTML = `
      <div style="margin-bottom:14px;">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px;">
          <div class="panel-company">${d.name}</div>
          <span class="${typeClass}">${typeLabel}</span>
        </div>
        <div class="panel-sub">${d.sub}</div>
      </div>
      <div class="metric-grid">${metricsHtml}</div>
      ${sectionCard('What they do & how they make money', `<p><strong>What they do:</strong> ${d.what_they_do}</p><p style="margin-top:8px;"><strong>How they make money:</strong> ${d.how_they_make_money}</p>`, true)}
      ${sectionCard('Earnings & financials', d.earnings, false)}
      ${sectionCard('What management is saying', d.management, false)}
      ${sectionCard('Recent news', d.news, false)}
      <div class="divider"></div>
      <div class="pewhat"><div class="pewhat-label">PE so-what</div><div class="pewhat-text">${d.pewhat}</div></div>`;
  }

  function renderSectorResult(d) {
    document.getElementById('searchContent').innerHTML = `
      <div class="feed-card" style="cursor:default;">
        <div class="feed-content">
          <div class="feed-title" style="font-size:15px;">${d.name}</div>
          <div class="feed-sub" style="margin-top:4px;">${d.sub}</div>
        </div>
      </div>`;
    document.getElementById('panelInner').innerHTML = `
      <div style="margin-bottom:14px;">
        <div class="panel-company">${d.name}</div>
        <div class="panel-sub">${d.sub}</div>
      </div>
      ${sectionCard("What's happening now", d.whats_happening, true)}
      ${sectionCard('Recent transactions', d.transactions, false)}
      ${sectionCard('Tailwinds', d.tailwinds, false)}
      ${sectionCard('Headwinds', d.headwinds, false)}
      ${sectionCard('Regulatory landscape', d.regulatory, false)}
      <div class="divider"></div>
      <div class="pewhat"><div class="pewhat-label">PE so-what</div><div class="pewhat-text">${d.pewhat}</div></div>`;
  }

  function sectionCard(title, content, open) {
    const preview = content.replace(/<[^>]+>/g, '').substring(0, 80) + '...';
    return `<div class="section-card ${open ? 'open' : ''}" onclick="toggleSection(this)">
      <div class="section-card-header">
        <div class="section-card-title">
          <div class="section-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
          ${title}
        </div>
        <svg class="expand-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="section-preview">${preview}</div>
      <div class="section-body">${content}</div>
    </div>`;
  }

  function toggleSection(card) { card.classList.toggle('open'); }

  function filterFeed(tag, el) {
    document.querySelectorAll('.filter-pills .pill').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    document.querySelectorAll('#feedContent .feed-card').forEach(card => {
      card.style.display = (tag === 'all' || card.dataset.tag === tag) ? 'flex' : 'none';
    });
  }

  function setSearchType(type) {
    searchType = type;
    document.getElementById('btnCompany').classList.toggle('active', type === 'company');
    document.getElementById('btnSector').classList.toggle('active', type === 'sector');
    document.getElementById('searchInput').placeholder = type === 'company'
      ? 'Search company (e.g. Medtronic)...'
      : 'Search subsector (e.g. biopharma)...';
  }

  function switchTab(tab, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    if (tab === 'feed') {
      document.getElementById('feedView').classList.remove('hidden');
      document.getElementById('searchView').classList.remove('active');
    } else {
      document.getElementById('feedView').classList.add('hidden');
      document.getElementById('searchView').classList.add('active');
      setSearchType(tab === 'search' ? 'company' : 'sector');
      document.getElementById('searchInput').focus();
    }
  }

  document.getElementById('searchInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && this.value.trim()) runSearch(this.value.trim());
  });

  loadFeed();
</script>
</body>
</html>
