<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHP Healthcare Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0C2340; --navy-border: rgba(255,255,255,0.1);
    --blue-accent: #4A9FE0; --blue-light: #E6F1FB; --blue-mid: #185FA5;
    --bg: #F2F4F7; --surface: #ffffff; --border: #E2E6EC;
    --text-primary: #0C2340; --text-secondary: #6B7A90; --text-muted: #A0AABB;
    --tag-deal-bg: #E6F1FB; --tag-deal-text: #185FA5;
    --tag-reg-bg: #FAEEDA; --tag-reg-text: #854F0B;
    --tag-fund-bg: #EEEDFE; --tag-fund-text: #534AB7;
    --tag-news-bg: #EAF3DE; --tag-news-text: #3B6D11;
    --pewhat-bg: #E6F1FB; --pewhat-border: #B5D4F4; --pewhat-text: #0C447C; --pewhat-label: #185FA5;
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text-primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { background: var(--navy); padding: 0 24px; height: 54px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; border-bottom: 0.5px solid var(--navy-border); }
  .logo { display: flex; align-items: center; gap: 10px; color: #fff; font-size: 14px; font-weight: 500; }
  .logo-mark { width: 28px; height: 28px; background: var(--blue-accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 11px; color: #fff; }
  .search-bar { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.07); border: 0.5px solid rgba(255,255,255,0.15); border-radius: var(--radius-md); padding: 7px 14px; width: 300px; transition: all 0.15s; }
  .search-bar:focus-within { background: rgba(255,255,255,0.11); border-color: var(--blue-accent); }
  .search-bar svg { color: rgba(255,255,255,0.35); flex-shrink: 0; }
  .search-bar input { background: none; border: none; outline: none; color: #fff; font-family: 'DM Sans', sans-serif; font-size: 13px; width: 100%; }
  .search-bar input::placeholder { color: rgba(255,255,255,0.35); }
  .search-type { display: flex; gap: 4px; }
  .search-type button { background: none; border: 0.5px solid rgba(255,255,255,0.15); border-radius: 20px; color: rgba(255,255,255,0.45); font-family: 'DM Sans', sans-serif; font-size: 11px; padding: 4px 10px; cursor: pointer; transition: all 0.15s; }
  .search-type button.active, .search-type button:hover { background: var(--blue-accent); border-color: var(--blue-accent); color: #fff; }
  .tabs { background: var(--navy); padding: 0 24px; display: flex; flex-shrink: 0; }
  .tab { padding: 10px 18px; font-size: 12.5px; color: rgba(255,255,255,0.45); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; user-select: none; }
  .tab:hover { color: rgba(255,255,255,0.75); }
  .tab.active { color: #fff; border-bottom-color: var(--blue-accent); }
  .app-body { display: flex; flex: 1; overflow: hidden; }
  .main { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .main::-webkit-scrollbar { width: 4px; }
  .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .section-label { font-size: 10.5px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; }
  .refresh-btn { font-size: 11px; padding: 4px 12px; border-radius: 20px; border: 0.5px solid var(--border); background: var(--surface); color: var(--text-secondary); cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 5px; }
  .refresh-btn:hover { background: var(--navy); color: #fff; border-color: var(--navy); }
  .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .feed-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 10px; cursor: pointer; transition: all 0.15s; }
  .feed-card:hover { border-color: var(--blue-accent); box-shadow: 0 2px 12px rgba(74,159,224,0.08); }
  .feed-card-top { display: flex; align-items: flex-start; gap: 12px; }
  .feed-tag { font-size: 10px; font-weight: 500; padding: 3px 9px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; margin-top: 2px; }
  .tag-deal { background: var(--tag-deal-bg); color: var(--tag-deal-text); }
  .tag-reg { background: var(--tag-reg-bg); color: var(--tag-reg-text); }
  .tag-fund { background: var(--tag-fund-bg); color: var(--tag-fund-text); }
  .tag-news { background: var(--tag-news-bg); color: var(--tag-news-text); }
  .feed-content { flex: 1; }
  .feed-title { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; line-height: 1.45; }
  .feed-summary { font-size: 12px; color: var(--text-secondary); line-height: 1.55; }
  .feed-pewhat { margin-top: 12px; padding-top: 12px; border-top: 0.5px solid var(--border); display: none; }
  .feed-card.expanded .feed-pewhat { display: block; }
  .pewhat-label { font-size: 10px; font-weight: 500; color: var(--pewhat-label); text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 5px; }
  .pewhat-text { font-size: 12.5px; color: var(--pewhat-text); line-height: 1.6; background: var(--pewhat-bg); border: 0.5px solid var(--pewhat-border); border-radius: var(--radius-sm); padding: 10px 12px; }
  .panel { width: 380px; background: var(--surface); border-left: 0.5px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
  .panel-inner { overflow-y: auto; padding: 20px; flex: 1; }
  .panel-inner::-webkit-scrollbar { width: 4px; }
  .panel-inner::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .panel-company { font-size: 16px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; line-height: 1.4; }
  .panel-sub { font-size: 12px; color: var(--text-secondary); margin-bottom: 14px; }
  .private-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: var(--tag-reg-text); background: var(--tag-reg-bg); padding: 3px 8px; border-radius: 20px; margin-left: 6px; }
  .public-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: var(--tag-news-text); background: var(--tag-news-bg); padding: 3px 8px; border-radius: 20px; margin-left: 6px; }
  .panel-section { margin-bottom: 14px; }
  .panel-section-label { font-size: 10px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 6px; }
  .panel-section-text { font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; }
  .divider { height: 0.5px; background: var(--border); margin: 14px 0; }
  .pewhat-panel { background: var(--pewhat-bg); border: 0.5px solid var(--pewhat-border); border-radius: var(--radius-md); padding: 14px; }
  .pewhat-panel-label { font-size: 10px; font-weight: 500; color: var(--pewhat-label); text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 6px; }
  .pewhat-panel-text { font-size: 12.5px; color: var(--pewhat-text); line-height: 1.6; }
  .empty-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 40px; text-align: center; }
  .empty-icon { width: 48px; height: 48px; background: var(--bg); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  .empty-title { font-size: 14px; font-weight: 500; color: var(--text-primary); margin-bottom: 6px; }
  .empty-sub { font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; }
  .skeleton { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 10px; }
  .skel-bar { height: 11px; background: var(--border); border-radius: 4px; margin-bottom: 8px; animation: pulse 1.5s ease infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .error-card { background: #FCEBEB; border: 0.5px solid #F7C1C1; border-radius: var(--radius-md); padding: 14px; font-size: 12.5px; color: #A32D2D; line-height: 1.6; margin-bottom: 10px; }
  .feed-view.hidden { display: none; }
  .search-view { display: none; }
  .search-view.active { display: block; }
  .dot-pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--blue-accent); animation: pulse 1s ease infinite; flex-shrink: 0; display: inline-block; margin-right: 8px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-mark">GHP</div>
    Healthcare Intelligence
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="search-bar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Search company or subsector..." />
    </div>
    <div class="search-type">
      <button class="active" id="btnCompany" onclick="setSearchType('company')">Company</button>
      <button id="btnSector" onclick="setSearchType('sector')">Subsector</button>
    </div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('feed',this)">Deal feed</div>
  <div class="tab" onclick="switchTab('search',this)">Company search</div>
  <div class="tab" onclick="switchTab('subsector',this)">Subsector search</div>
</div>

<div class="app-body">
  <div class="main">

    <div id="feedView">
      <div class="section-header">
        <span class="section-label" id="feedLabel">Last 7 days — healthcare PE</span>
        <button class="refresh-btn" id="refreshBtn" onclick="loadFeed(true)">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          Refresh feed
        </button>
      </div>
      <div id="feedContent">
        <div class="skeleton"><div class="skel-bar" style="width:40%"></div><div class="skel-bar" style="width:75%"></div><div class="skel-bar" style="width:55%"></div></div>
        <div class="skeleton"><div class="skel-bar" style="width:35%"></div><div class="skel-bar" style="width:80%"></div><div class="skel-bar" style="width:50%"></div></div>
        <div class="skeleton"><div class="skel-bar" style="width:45%"></div><div class="skel-bar" style="width:70%"></div><div class="skel-bar" style="width:60%"></div></div>
      </div>
    </div>

    <div class="search-view" id="searchView">
      <div class="section-header">
        <span class="section-label" id="searchLabel">Search</span>
      </div>
      <div id="searchContent">
        <div class="empty-panel" style="padding:60px 20px;">
          <div class="empty-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A9FE0" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div>
          <div class="empty-title">Search a company or subsector</div>
          <div class="empty-sub">Type in the search bar above and press Enter.</div>
        </div>
      </div>
    </div>

  </div>

  <div class="panel">
    <div class="panel-inner" id="panelInner">
      <div class="empty-panel">
        <div class="empty-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A9FE0" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
        <div class="empty-title">Select a story</div>
        <div class="empty-sub">Click any item in the feed to expand the PE so-what.</div>
      </div>
    </div>
  </div>
</div>

<script>
  const WORKER_URL = 'https://ghp-healthcare-api.jhads21.workers.dev';
  let searchType = 'company';
  let feedLoaded = false;

  async function callClaude(prompt, maxTokens) {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: maxTokens || 1500,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        messages: [{ role: 'user', content: prompt }]
      })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
    const texts = (data.content || []).filter(b => b.type === 'text');
    if (!texts.length) throw new Error('No text in response');
    return texts[texts.length - 1].text.trim();
  }

  function parseCards(text) {
    const blocks = text.split(/\n---+\n/).map(b => b.trim()).filter(Boolean);
    return blocks.map(block => {
      const get = (key) => {
        const match = block.match(new RegExp(key + ':\\s*(.+?)(?=\\n[A-Z_]+:|$)', 's'));
        return match ? match[1].trim() : '';
      };
      return {
        title: get('TITLE'),
        tag: (get('TAG') || 'news').toLowerCase().trim(),
        summary: get('SUMMARY'),
        pewhat: get('PEWHAT')
      };
    }).filter(c => c.title);
  }

  async function loadFeed(manual) {
    if (manual) {
      const confirmed = confirm('Refresh the feed? This will use API credits.');
      if (!confirmed) return;
    }
    feedLoaded = true;
    document.getElementById('refreshBtn').disabled = true;
    document.getElementById('feedLabel').textContent = 'Loading...';
    document.getElementById('feedContent').innerHTML = `
      <div class="skeleton"><div class="skel-bar" style="width:40%"></div><div class="skel-bar" style="width:75%"></div><div class="skel-bar" style="width:55%"></div></div>
      <div class="skeleton"><div class="skel-bar" style="width:35%"></div><div class="skel-bar" style="width:80%"></div><div class="skel-bar" style="width:50%"></div></div>
      <div class="skeleton"><div class="skel-bar" style="width:45%"></div><div class="skel-bar" style="width:70%"></div><div class="skel-bar" style="width:60%"></div></div>`;

    const today = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

    try {
      const prompt = `You are a healthcare PE analyst for Great Hill Partners, a growth-oriented PE firm.

Today's date is ${today}. Search the web using queries like "healthcare PE deals this week" and "healthcare private equity news ${today.split(',')[1].trim()}" to find 3 significant recent healthcare PE stories. Always search for the most current results available.

Respond in EXACTLY this format. No introduction, no extra text, just the stories:

TITLE: [headline under 12 words]
TAG: [one of: deal, reg, fund, news]
SUMMARY: [2 sentences plain english — what happened and the key facts]
PEWHAT: [2 sentences direct opinionated view — should a growth PE healthcare investor care about this and why]

---

TITLE: [headline]
TAG: [tag]
SUMMARY: [summary]
PEWHAT: [pewhat]

---

TITLE: [headline]
TAG: [tag]
SUMMARY: [summary]
PEWHAT: [pewhat]`;

      const raw = await callClaude(prompt, 1500);
      const cards = parseCards(raw);
      if (!cards.length) throw new Error('No stories found in response.');

      document.getElementById('feedContent').innerHTML = cards.map((c, i) => `
        <div class="feed-card" onclick="this.classList.toggle('expanded')" data-idx="${i}">
          <div class="feed-card-top">
            <span class="feed-tag tag-${c.tag}">${tagLabel(c.tag)}</span>
            <div class="feed-content">
              <div class="feed-title">${c.title}</div>
              <div class="feed-summary">${c.summary}</div>
            </div>
          </div>
          <div class="feed-pewhat">
            <div class="pewhat-label">PE so-what</div>
            <div class="pewhat-text">${c.pewhat}</div>
          </div>
        </div>`).join('');

      document.getElementById('feedLabel').textContent = `Last 7 days — healthcare PE · ${today}`;
    } catch (err) {
      document.getElementById('feedContent').innerHTML = `<div class="error-card">Failed to load feed: ${err.message}</div>`;
      document.getElementById('feedLabel').textContent = 'Feed unavailable';
      feedLoaded = false;
    }
    document.getElementById('refreshBtn').disabled = false;
  }

  function tagLabel(tag) {
    return { deal: 'Deal', reg: 'Regulatory', fund: 'Fund activity', news: 'News' }[tag] || 'News';
  }

  async function runSearch(query) {
    document.getElementById('feedView').classList.add('hidden');
    document.getElementById('searchView').classList.add('active');
    document.getElementById('searchLabel').textContent = `Searching "${query}"...`;
    document.getElementById('searchContent').innerHTML = `<div style="padding:20px 0;font-size:12.5px;color:var(--text-secondary);"><span class="dot-pulse"></span>Researching "${query}" — takes about 15 seconds...</div>`;
    document.getElementById('panelInner').innerHTML = `<div class="empty-panel"><div class="empty-title" style="color:var(--text-secondary)">Researching...</div></div>`;

    try {
      let prompt;
      if (searchType === 'company') {
        prompt = `You are a healthcare PE analyst for Great Hill Partners.

Search the web for information about the company "${query}". Find recent news, financials, and business details.

Respond in EXACTLY this format with no extra text:

NAME: [company name]
TYPE: [public or private]
DESCRIPTOR: [one line: sector · location]
WHAT_THEY_DO: [1-2 sentences plain english no jargon — what does this company actually do, explained simply]
HOW_THEY_MAKE_MONEY: [1-2 sentences plain english on the revenue model]
FINANCIALS: [2-3 sentences on recent financial performance with actual numbers where available. If private and data unavailable, say so.]
MANAGEMENT: [2 sentences on what management is focused on or saying publicly]
NEWS: [2 sentences on the most recent significant news]
PEWHAT: [2-3 sentences direct opinionated view — interesting or not for a growth PE healthcare investor right now and why. Be specific.]`;
      } else {
        prompt = `You are a healthcare PE analyst for Great Hill Partners.

Search the web for recent information about the healthcare subsector "${query}".

Respond in EXACTLY this format with no extra text:

NAME: [subsector name]
DESCRIPTOR: [brief descriptor]
WHATS_HAPPENING: [2-3 sentences on the current state right now]
TRANSACTIONS: [2-3 sentences on notable recent M&A or PE deals]
TAILWINDS: [2-3 sentences on key growth drivers]
HEADWINDS: [2-3 sentences on key risks]
REGULATORY: [2-3 sentences on the regulatory landscape and what is changing]
PEWHAT: [2-3 sentences direct opinionated view — lean in or avoid for GHP right now and why]`;
      }

      const raw = await callClaude(prompt, 1500);

      const get = (key) => {
        const match = raw.match(new RegExp(key + ':\\s*(.+?)(?=\\n[A-Z_]+:|$)', 's'));
        return match ? match[1].trim() : 'N/A';
      };

      if (searchType === 'company') {
        const type = get('TYPE').toLowerCase();
        const typeClass = type === 'private' ? 'private-badge' : 'public-badge';
        const typeBadge = type === 'private' ? '🔒 Private' : '📈 Public';
        document.getElementById('searchContent').innerHTML = `
          <div class="feed-card" style="cursor:default;">
            <div class="feed-content">
              <div class="feed-title" style="font-size:15px;">${get('NAME')} <span class="${typeClass}">${typeBadge}</span></div>
              <div class="feed-summary" style="margin-top:4px;">${get('DESCRIPTOR')}</div>
            </div>
          </div>`;
        document.getElementById('panelInner').innerHTML = `
          <div style="margin-bottom:16px;">
            <div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:4px;">
              <div class="panel-company">${get('NAME')}</div>
              <span class="${typeClass}">${typeBadge}</span>
            </div>
            <div class="panel-sub">${get('DESCRIPTOR')}</div>
          </div>
          ${ps('What they do', get('WHAT_THEY_DO'))}
          ${ps('How they make money', get('HOW_THEY_MAKE_MONEY'))}
          ${ps('Financials', get('FINANCIALS'))}
          ${ps('What management is saying', get('MANAGEMENT'))}
          ${ps('Recent news', get('NEWS'))}
          <div class="divider"></div>
          <div class="pewhat-panel">
            <div class="pewhat-panel-label">PE so-what</div>
            <div class="pewhat-panel-text">${get('PEWHAT')}</div>
          </div>`;
      } else {
        document.getElementById('searchContent').innerHTML = `
          <div class="feed-card" style="cursor:default;">
            <div class="feed-content">
              <div class="feed-title" style="font-size:15px;">${get('NAME')}</div>
              <div class="feed-summary" style="margin-top:4px;">${get('DESCRIPTOR')}</div>
            </div>
          </div>`;
        document.getElementById('panelInner').innerHTML = `
          <div style="margin-bottom:16px;">
            <div class="panel-company">${get('NAME')}</div>
            <div class="panel-sub">${get('DESCRIPTOR')}</div>
          </div>
          ${ps("What's happening now", get('WHATS_HAPPENING'))}
          ${ps('Recent transactions', get('TRANSACTIONS'))}
          ${ps('Tailwinds', get('TAILWINDS'))}
          ${ps('Headwinds', get('HEADWINDS'))}
          ${ps('Regulatory landscape', get('REGULATORY'))}
          <div class="divider"></div>
          <div class="pewhat-panel">
            <div class="pewhat-panel-label">PE so-what</div>
            <div class="pewhat-panel-text">${get('PEWHAT')}</div>
          </div>`;
      }
      document.getElementById('searchLabel').textContent = `Results for "${query}"`;
    } catch (err) {
      document.getElementById('searchContent').innerHTML = `<div class="error-card">Search failed: ${err.message}</div>`;
      document.getElementById('searchLabel').textContent = 'Search failed';
    }
  }

  function ps(label, text) {
    return `<div class="panel-section">
      <div class="panel-section-label">${label}</div>
      <div class="panel-section-text">${text}</div>
    </div>`;
  }

  function setSearchType(type) {
    searchType = type;
    document.getElementById('btnCompany').classList.toggle('active', type === 'company');
    document.getElementById('btnSector').classList.toggle('active', type === 'sector');
    document.getElementById('searchInput').placeholder = type === 'company'
      ? 'Search company (e.g. Medtronic)...'
      : 'Search subsector (e.g. biopharma)...';
  }

  function switchTab(tab, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    if (tab === 'feed') {
      document.getElementById('feedView').classList.remove('hidden');
      document.getElementById('searchView').classList.remove('active');
    } else {
      document.getElementById('feedView').classList.add('hidden');
      document.getElementById('searchView').classList.add('active');
      setSearchType(tab === 'search' ? 'company' : 'sector');
      document.getElementById('searchInput').focus();
    }
  }

  document.getElementById('searchInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && this.value.trim()) runSearch(this.value.trim());
  });

  loadFeed(false);
</script>
</body>
</html>
